name: CI

on:
  workflow_call:
  push:
    branches:
      - main
      - codex/hejhome-v3-stable
      - codex/hejhome-3.0.0-beta
      - codex/hejhome-v3-verification-readiness
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node-version }} / Homebridge ${{ matrix.homebridge-channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.13.0
          - 24.x
          - 26.x
        homebridge-channel: [latest, beta]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install host under test
        run: npm install --no-save --package-lock=false "homebridge@$HOST_CHANNEL"
        env:
          HOST_CHANNEL: ${{ matrix.homebridge-channel }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run verify

      - name: Package dry run
        run: npm pack --dry-run
