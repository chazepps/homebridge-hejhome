name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    permissions:
      contents: read
      id-token: write
    name: Publish npm package
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release channel
        id: channel
        run: node tools/release/channel.mjs "$GITHUB_REF_NAME"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify release gate
        run: npm run verify

      - name: Package dry run
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance --tag "$RELEASE_CHANNEL"
        env:
          RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
